<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle ?: '用户管理'}"></title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100">
<div th:replace="~{fragments/admin_nav :: navbar}"></div>
<div class="container mx-auto mt-8 p-4">
  <h1 class="text-3xl font-semibold text-gray-800 mb-6" th:text="${pageTitle}">用户管理</h1>
  <div th:if="${successMessage}" class="mb-4 p-3 bg-green-100 text-green-700 border border-green-300 rounded-md" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="mb-4 p-3 bg-red-100 text-red-700 border border-red-300 rounded-md" th:text="${errorMessage}"></div>

  <div class="bg-white p-6 rounded-lg shadow-md overflow-x-auto">
    <div th:if="${userPage == null or userPage.isEmpty()}" class="text-center text-gray-500 py-4">
      暂无用户信息。
    </div>
    <table th:unless="${userPage == null or userPage.isEmpty()}" class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
          <a th:href="@{/admin/users(sort='id,' + (${sortField == 'id'} ? ${reverseSortDir} : 'asc'))}">ID</a></th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
          <a th:href="@{/admin/users(sort='username,' + (${sortField == 'username'} ? ${reverseSortDir} : 'asc'))}">用户名</a></th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
          <a th:href="@{/admin/users(sort='name,' + (${sortField == 'name'} ? ${reverseSortDir} : 'asc'))}">姓名</a></th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">邮箱</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">电话</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">角色</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">注册时间</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
      </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
      <tr th:each="user : ${userPage.content}">
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${user.id}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700" th:text="${user.username}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${user.name ?: '-'}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${user.email ?: '-'}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${user.phone ?: '-'}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <span th:text="${user.role}"
                                  th:classappend="${user.role == 'ADMIN'} ? 'px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800' : 'px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800'">
                            </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
          <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="text-indigo-600 hover:text-indigo-900 mr-3" title="编辑用户">
            <i class="fas fa-user-edit"></i>
          </a>
          <a th:if="${session.loggedInUser != null && session.loggedInUser.id != user.id}"
             th:href="@{/admin/users/delete/{id}(id=${user.id})}"
             class="text-red-600 hover:text-red-900" title="删除用户"
             th:data-username="${user.username}"
             onclick="return confirm('确定要删除用户 \'' + this.getAttribute('data-username') + '\' 吗？此操作不可恢复。');">
            <i class="fas fa-user-times"></i>
          </a>
          <span th:if="${session.loggedInUser != null && session.loggedInUser.id == user.id}" class="text-gray-400 cursor-not-allowed" title="不能删除自己">
                                <i class="fas fa-user-times"></i>
                            </span>
        </td>
      </tr>
      </tbody>
    </table>
    <div th:if="${userPage != null && userPage.totalPages > 1}" class="mt-6 flex items-center justify-between">
      <div class="text-sm text-gray-700">
        第 <span th:text="${userPage.number + 1}"></span> 页，共 <span th:text="${userPage.totalPages}"></span> 页 (总计 <span th:text="${userPage.totalElements}"></span> 条记录)
      </div>
      <nav aria-label="Pagination">
        <ul class="inline-flex -space-x-px rounded-md shadow-sm">
          <li th:classappend="${userPage.first} ? 'pointer-events-none opacity-50' : ''">
            <a th:href="@{/admin/users(page=${userPage.number - 1}, size=${userPage.size}, sort=${sortField + ',' + sortDir})}"
               class="px-3 py-2 ml-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100 hover:text-gray-700">
              <i class="fas fa-chevron-left"></i></a></li>
          <li th:each="i : ${#numbers.sequence(0, userPage.totalPages - 1)}"
              th:if="${userPage.totalPages <= 7 or (i == 0 or i == userPage.totalPages - 1 or (i >= userPage.number - 1 and i <= userPage.number + 1))}">
                             <span th:if="${(i == userPage.number - 2 and userPage.number > 2 and userPage.totalPages > 7) or (i == userPage.number + 2 and userPage.number < userPage.totalPages - 3 and userPage.totalPages > 7)}"
                                   class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300">...</span>
            <a th:href="@{/admin/users(page=${i}, size=${userPage.size}, sort=${sortField + ',' + sortDir})}"
               th:text="${i + 1}"
               th:classappend="${i == userPage.number} ? 'z-10 px-3 py-2 text-blue-600 border-blue-300 bg-blue-50' : 'px-3 py-2 text-gray-500 bg-white border-gray-300 hover:bg-gray-100'"></a></li>
          <li th:classappend="${userPage.last} ? 'pointer-events-none opacity-50' : ''">
            <a th:href="@{/admin/users(page=${userPage.number + 1}, size=${userPage.size}, sort=${sortField + ',' + sortDir})}"
               class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100 hover:text-gray-700">
              <i class="fas fa-chevron-right"></i></a></li>
        </ul>
      </nav>
    </div>
  </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
