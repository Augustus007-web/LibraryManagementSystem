<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle ?: '类别表单'}"></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style> body { font-family: 'Inter', sans-serif; } .form-container { max-width: 600px; } </style>
</head>
<body class="bg-gray-100">
<div th:replace="~{fragments/admin_nav :: navbar}"></div>
<div class="container mx-auto mt-8 p-4 flex justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg form-container w-full">
        <h2 class="text-2xl font-bold text-center text-gray-700 mb-6" th:text="${pageTitle}">类别表单</h2>

        <div th:if="${errorMessage}" class="mb-4 p-3 bg-red-100 text-red-700 border border-red-300 rounded-md" th:text="${errorMessage}"></div>

        <form th:action="@{/admin/categories/save}" th:object="${categoryDto}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-gray-700">类别名称 <span class="text-red-500">*</span></label>
                <input type="text" id="name" th:field="*{name}"
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                       th:classappend="${#fields.hasErrors('name')} ? 'border-red-500' : ''">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-xs text-red-600 mt-1"></p>
            </div>

            <div class="mb-6">
                <label for="description" class="block text-sm font-medium text-gray-700">描述 (可选)</label>
                <textarea id="description" th:field="*{description}" rows="3"
                          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                          th:classappend="${#fields.hasErrors('description')} ? 'border-red-500' : ''"></textarea>
                <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-xs text-red-600 mt-1"></p>
            </div>

            <div class="flex items-center justify-end space-x-3 mt-8">
                <a th:href="@{/admin/categories}" class="text-gray-600 hover:text-gray-800 font-medium py-2 px-4 rounded-md border border-gray-300 hover:bg-gray-50 transition">
                    取消
                </a>
                <button type="submit"
                        class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:shadow-outline transition">
                    <i class="fas fa-save mr-2"></i>保存类别
                </button>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
