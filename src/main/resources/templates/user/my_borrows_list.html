<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle ?: '我的借阅'}"></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100">
<div th:replace="~{fragments/user_nav :: navbar}"></div>

<div class="container mx-auto mt-8 p-4">
    <h1 class="text-3xl font-semibold text-gray-800 mb-6" th:text="${pageTitle}">我的借阅记录</h1>
    <div th:if="${successMessage != null}" class="mb-4 p-3 bg-green-100 text-green-700 border border-green-300 rounded-md" th:text="${successMessage}"></div>
    <div th:if="${errorMessage != null}" class="mb-4 p-3 bg-red-100 text-red-700 border border-red-300 rounded-md" th:text="${errorMessage}"></div>

    <div class="bg-white p-6 rounded-lg shadow-md overflow-x-auto">
        <div th:if="${borrowPage == null or borrowPage.isEmpty()}" class="text-center text-gray-500 py-4">
            您当前没有借阅记录。
        </div>
        <table th:unless="${borrowPage == null or borrowPage.isEmpty()}" class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">图书标题</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ISBN</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">借阅日期</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">应还日期</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">归还日期</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="record : ${borrowPage.content}">
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${record.book?.title}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700" th:text="${record.book?.isbn}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(record.borrowDate, 'yyyy-MM-dd HH:mm')}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(record.dueDate, 'yyyy-MM-dd')}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${record.returnDate != null ? #temporals.format(record.returnDate, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm">
                    <span th:text="${record.status}"
                          th:classappend="${record.status == 'RETURNED'} ? 'text-green-600' : (${record.status == 'OVERDUE'} ? 'text-red-600 font-bold' : 'text-yellow-600')">
                    </span>
                    <span th:if="${record.status == 'BORROWED' && record.dueDate.isBefore(#temporals.createNow())}" class="ml-2 px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">已逾期</span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                    <form th:if="${record.status == 'BORROWED' or record.status == 'OVERDUE'}" th:action="@{/return/{borrowRecordId}(borrowRecordId=${record.id})}" method="post">
                        <button type="submit" class="return-button text-blue-600 hover:text-blue-900" th:data-book-title="${record.book?.title}">
                            <i class="fas fa-undo-alt mr-1"></i>还书
                        </button>
                    </form>
                    <span th:unless="${record.status == 'BORROWED' or record.status == 'OVERDUE'}">-</span>
                </td>
            </tr>
            </tbody>
        </table>
        <div th:if="${borrowPage != null && borrowPage.totalPages > 1}" class="mt-6 flex items-center justify-between">
            <div class="text-sm text-gray-700">
                第 <span th:text="${borrowPage.number + 1}"></span> 页，共 <span th:text="${borrowPage.totalPages}"></span> 页 (总计 <span th:text="${borrowPage.totalElements}"></span> 条记录)
            </div>
            <nav aria-label="Pagination">
                <ul class="inline-flex -space-x-px rounded-md shadow-sm">
                    <li th:classappend="${borrowPage.first} ? 'pointer-events-none opacity-50' : ''">
                        <a th:href="@{/my-borrows(page=${borrowPage.number - 1}, size=${borrowPage.size})}"
                           class="px-3 py-2 ml-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100 hover:text-gray-700">
                            <i class="fas fa-chevron-left"></i></a></li>
                    <li th:each="i : ${#numbers.sequence(0, borrowPage.totalPages - 1)}"
                        th:if="${borrowPage.totalPages <= 7 or (i == 0 or i == borrowPage.totalPages - 1 or (i >= borrowPage.number - 1 and i <= borrowPage.number + 1))}">
                             <span th:if="${(i == borrowPage.number - 2 and borrowPage.number > 2 and borrowPage.totalPages > 7) or (i == borrowPage.number + 2 and borrowPage.number < borrowPage.totalPages - 3 and borrowPage.totalPages > 7)}"
                                   class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300">...</span>
                        <a th:href="@{/my-borrows(page=${i}, size=${borrowPage.size})}"
                           th:text="${i + 1}"
                           th:classappend="${i == borrowPage.number} ? 'z-10 px-3 py-2 text-blue-600 border-blue-300 bg-blue-50' : 'px-3 py-2 text-gray-500 bg-white border-gray-300 hover:bg-gray-100'"></a></li>
                    <li th:classappend="${borrowPage.last} ? 'pointer-events-none opacity-50' : ''">
                        <a th:href="@{/my-borrows(page=${borrowPage.number + 1}, size=${borrowPage.size})}"
                           class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100 hover:text-gray-700">
                            <i class="fas fa-chevron-right"></i></a></li>
                </ul>
            </nav>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const returnButtons = document.querySelectorAll('.return-button');
        returnButtons.forEach(button => {
            button.addEventListener('click', function(event) {
                event.preventDefault();
                const bookTitle = this.getAttribute('data-book-title');
                if (confirm('确定要归还《' + bookTitle + '》吗？')) {
                    this.closest('form').submit();
                }
            });
        });
    });
</script>
</body>
</html>
