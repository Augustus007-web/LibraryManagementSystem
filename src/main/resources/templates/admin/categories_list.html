<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle ?: '图书类别管理'}">图书类别管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style> body { font-family: 'Inter', sans-serif; } .table-fixed-layout { table-layout: fixed; } </style>
</head>
<body class="bg-gray-100">
<div th:replace="~{fragments/admin_nav :: navbar}"></div>

<div class="container mx-auto mt-8 p-4">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-semibold text-gray-800" th:text="${pageTitle}">图书类别管理</h1>
    <a th:href="@{/admin/categories/add}" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md transition">
      <i class="fas fa-plus mr-2"></i>添加新类别
    </a>
  </div>
  <div th:if="${successMessage}" class="mb-4 p-3 bg-green-100 text-green-700 border border-green-300 rounded-md" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="mb-4 p-3 bg-red-100 text-red-700 border border-red-300 rounded-md" th:text="${errorMessage}"></div>

  <div class="bg-white p-6 rounded-lg shadow-md">
    <div th:if="${categories == null || categories.isEmpty()}" class="text-center text-gray-500 py-4">
      暂无图书类别信息。
    </div>
    <table th:unless="${categories == null || categories.isEmpty()}" class="min-w-full divide-y divide-gray-200 table-fixed-layout">
      <thead class="bg-gray-50">
      <tr>
        <th scope="col" class="w-1/6 px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
        <th scope="col" class="w-2/6 px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">类别名称</th>
        <th scope="col" class="w-2/6 px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">描述</th>
        <th scope="col" class="w-1/6 px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
      </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
      <tr th:each="category : ${categories}">
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${category.id}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700" th:text="${category.name}"></td>
        <td class="px-6 py-4 text-sm text-gray-500 break-words" th:text="${#strings.abbreviate(category.description, 50)}" th:title="${category.description}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
          <a th:href="@{/admin/categories/edit/{id}(id=${category.id})}" class="text-indigo-600 hover:text-indigo-900 mr-3" title="编辑">
            <i class="fas fa-edit"></i>
          </a>
          <a th:href="@{/admin/categories/delete/{id}(id=${category.id})}"
             th:onclick="'return confirm(`确定要删除类别 ` + ${category.name} + ` 吗？如果该类别下有图书，将无法删除。`);'"
             class="text-red-600 hover:text-red-900" title="删除">
            <i class="fas fa-trash-alt"></i>
          </a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
