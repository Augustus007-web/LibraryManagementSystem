<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 图书管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .form-container { max-width: 400px; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-lg shadow-lg form-container w-full">
    <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">图书管理系统登录</h2>

    <div th:if="${successMessage}" class="mb-4 p-3 bg-green-100 text-green-700 border border-green-300 rounded-md">
        <p th:text="${successMessage}"></p>
    </div>

    <div th:if="${errorMessage}" class="mb-4 p-3 bg-red-100 text-red-700 border border-red-300 rounded-md">
        <p th:text="${errorMessage}"></p>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-4">
            <label for="username" class="block text-sm font-medium text-gray-700">用户名 (学号)</label>
            <input type="text" id="username" name="username" required
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
        <div class="mb-6">
            <label for="password" class="block text-sm font-medium text-gray-700">密码</label>
            <input type="password" id="password" name="password" required
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:shadow-outline transition duration-150">
            登 录
        </button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-600">
        还没有账户? <a th:href="@{/register}" class="font-medium text-indigo-600 hover:text-indigo-500">立即注册</a>
    </p>
</div>
</body>
</html>
