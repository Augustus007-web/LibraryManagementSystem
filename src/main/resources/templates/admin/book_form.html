<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle ?: '图书表单'}"></title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style> body { font-family: 'Inter', sans-serif; } .form-container { max-width: 700px; } </style>
</head>
<body class="bg-gray-100">
<div th:replace="~{fragments/admin_nav :: navbar}"></div>
<div class="container mx-auto mt-8 p-4 flex justify-center">
  <div class="bg-white p-8 rounded-lg shadow-lg form-container w-full">
    <h2 class="text-2xl font-bold text-center text-gray-700 mb-6" th:text="${pageTitle}">图书表单</h2>

    <form th:action="@{/admin/books/save}" th:object="${book}" method="post">
      <input type="hidden" th:field="*{id}" />

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="mb-4">
          <label for="isbn" class="block text-sm font-medium text-gray-700">ISBN</label>
          <input type="text" id="isbn" th:field="*{isbn}" required
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
        <div class="mb-4">
          <label for="title" class="block text-sm font-medium text-gray-700">书名</label>
          <input type="text" id="title" th:field="*{title}" required
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
        <div class="mb-4">
          <label for="author" class="block text-sm font-medium text-gray-700">作者</label>
          <input type="text" id="author" th:field="*{author}" required
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
        <div class="mb-4">
          <label for="publisher" class="block text-sm font-medium text-gray-700">出版社</label>
          <input type="text" id="publisher" th:field="*{publisher}"
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
        <div class="mb-4">
          <label for="publicationDate" class="block text-sm font-medium text-gray-700">出版日期</label>
          <input type="date" id="publicationDate" th:field="*{publicationDate}"
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
        <div class="mb-4">
          <label for="category" class="block text-sm font-medium text-gray-700">类别</label>
          <select id="category" th:field="*{category.id}" required class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            <option value="">-- 请选择类别 --</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"></option>
          </select>
        </div>
        <div class="mb-4">
          <label for="quantity" class="block text-sm font-medium text-gray-700">馆藏数量</label>
          <input type="number" id="quantity" th:field="*{quantity}" min="0" required
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
        <div class="mb-4" th:if="${book.id != null}"> <label for="availableQuantity" class="block text-sm font-medium text-gray-700">可借阅数量</label>
          <input type="number" id="availableQuantity" th:field="*{availableQuantity}" min="0"
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
      </div>
      <div class="mb-6">
        <label for="description" class="block text-sm font-medium text-gray-700">图书简介</label>
        <textarea id="description" th:field="*{description}" rows="3"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></textarea>
      </div>
      <div class="mb-6">
        <label for="coverImageUrl" class="block text-sm font-medium text-gray-700">封面图片URL (可选)</label>
        <input type="url" id="coverImageUrl" th:field="*{coverImageUrl}"
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
      </div>
      <div class="flex items-center justify-between mt-8">
        <a th:href="@{/admin/books}" class="text-gray-600 hover:text-gray-800 font-medium py-2 px-4 rounded-md border border-gray-300 hover:bg-gray-50 transition">返回列表</a>
        <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:shadow-outline transition">
          <i class="fas fa-save mr-2"></i>保存图书
        </button>
      </div>
    </form>
  </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
