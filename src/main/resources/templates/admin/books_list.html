<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle ?: '图书信息管理'}">图书信息管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100">
<div th:replace="~{fragments/admin_nav :: navbar}"></div>

<div class="container mx-auto mt-8 p-4">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-semibold text-gray-800" th:text="${pageTitle}">图书信息管理</h1>
        <a th:href="@{/admin/books/add}" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md transition">
            <i class="fas fa-plus mr-2"></i>添加新图书
        </a>
    </div>

    <form th:action="@{/admin/books}" method="get" class="mb-6 bg-white p-4 rounded-lg shadow">
        <div class="flex space-x-4 items-center">
            <label>
                <input type="text" name="keyword" th:value="${keyword}" placeholder="搜索书名、作者、ISBN..." class="flex-grow px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </label>
            <button type="submit" class="bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-2 px-4 rounded-md"><i class="fas fa-search mr-2"></i>搜索</button>
            <a th:href="@{/admin/books}" class="text-gray-600 hover:text-gray-800 py-2 px-4 rounded-md border border-gray-300 hover:bg-gray-50 transition">清空搜索</a>
        </div>
    </form>

    <div th:if="${successMessage}" class="mb-4 p-3 bg-green-100 text-green-700 border border-green-300 rounded-md" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="mb-4 p-3 bg-red-100 text-red-700 border border-red-300 rounded-md" th:text="${errorMessage}"></div>

    <div class="bg-white p-6 rounded-lg shadow-md overflow-x-auto">
        <div th:if="${bookPage == null or bookPage.isEmpty()}" class="text-center text-gray-500 py-4">
            <span th:if="${keyword != null && !keyword.isEmpty()}">未找到与 "<strong th:text="${keyword}"></strong>"相关的图书。</span>
            <span th:unless="${keyword != null && !keyword.isEmpty()}">暂无图书信息。</span>
        </div>
        <table th:unless="${bookPage == null or bookPage.isEmpty()}" class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    <a th:href="@{/admin/books(keyword=${keyword}, sort='id,' + (${sortField == 'id'} ? ${reverseSortDir} : 'asc'))}">ID
                        <i th:if="${sortField == 'id'}" th:class="${sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down'}"></i></a></th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ISBN</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    <a th:href="@{/admin/books(keyword=${keyword}, sort='title,' + (${sortField == 'title'} ? ${reverseSortDir} : 'asc'))}">书名
                        <i th:if="${sortField == 'title'}" th:class="${sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down'}"></i></a></th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">作者</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">类别</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">馆藏</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">可借</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="book : ${bookPage.content}">
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${book.id}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700" th:text="${book.isbn}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700" th:text="${book.title}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${book.author}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${book.category?.name ?: 'N/A'}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center" th:text="${book.quantity}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center" th:text="${book.availableQuantity}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                    <a th:href="@{/admin/books/edit/{id}(id=${book.id})}" class="text-indigo-600 hover:text-indigo-900 mr-3" title="编辑">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a th:href="@{/admin/books/delete/{id}(id=${book.id})}"
                       class="delete-book text-red-600 hover:text-red-900" title="删除"
                       th:data-book-title="${book.title}">
                        <i class="fas fa-trash-alt"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${bookPage != null && bookPage.totalPages > 0}" class="mt-6 flex items-center justify-between">
            <div class="text-sm text-gray-700">
                第 <span th:text="${bookPage.number + 1}"></span> 页，共 <span th:text="${bookPage.totalPages}"></span> 页 (总计 <span th:text="${bookPage.totalElements}"></span> 条记录)
            </div>
            <nav th:if="${bookPage.totalPages > 1}" aria-label="Pagination">
                <ul class="inline-flex -space-x-px rounded-md shadow-sm">
                    <li th:classappend="${bookPage.first} ? 'pointer-events-none opacity-50' : ''">
                        <a th:href="@{/admin/books(keyword=${keyword}, page=${bookPage.number - 1}, size=${bookPage.size}, sort=${sortField + ',' + sortDir})}"
                           class="px-3 py-2 ml-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100 hover:text-gray-700">
                            <span class="sr-only">上一页</span><i class="fas fa-chevron-left"></i>
                        </a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, bookPage.totalPages - 1)}"
                        th:if="${bookPage.totalPages <= 7 or (i == 0 or i == bookPage.totalPages - 1 or (i >= bookPage.number - 1 and i <= bookPage.number + 1))}">
                             <span th:if="${(i == bookPage.number - 2 and bookPage.number > 2 and bookPage.totalPages > 7) or (i == bookPage.number + 2 and bookPage.number < bookPage.totalPages - 3 and bookPage.totalPages > 7)}"
                                   class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300">...</span>
                        <a th:href="@{/admin/books(keyword=${keyword}, page=${i}, size=${bookPage.size}, sort=${sortField + ',' + sortDir})}"
                           th:text="${i + 1}"
                           th:classappend="${i == bookPage.number} ? 'z-10 px-3 py-2 leading-tight text-blue-600 border border-blue-300 bg-blue-50 hover:bg-blue-100 hover:text-blue-700' : 'px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700'">
                        </a>
                    </li>
                    <li th:classappend="${bookPage.last} ? 'pointer-events-none opacity-50' : ''">
                        <a th:href="@{/admin/books(keyword=${keyword}, page=${bookPage.number + 1}, size=${bookPage.size}, sort=${sortField + ',' + sortDir})}"
                           class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100 hover:text-gray-700">
                            <span class="sr-only">下一页</span><i class="fas fa-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const deleteLinks = document.querySelectorAll('.delete-book');
        deleteLinks.forEach(link => {
            link.addEventListener('click', function(event) {
                event.preventDefault(); // 阻止默认跳转
                const bookTitle = this.getAttribute('data-book-title');
                if (confirm('确定要删除这本书《' + bookTitle + '》吗？')) {
                    window.location.href = this.getAttribute('href'); // 用户确认后跳转
                }
            });
        });
    });
</script>

</body>
</html>
